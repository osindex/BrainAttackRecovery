services:
  linapro:
    image: ${LINAPRO_IMAGE:?Set LINAPRO_IMAGE in .env.prod}
    container_name: brain-rehab-linapro
    restart: unless-stopped
    networks:
      - 1panel-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Shanghai
      LINAPRO_JWT_SECRET: ${LINAPRO_JWT_SECRET:?Set LINAPRO_JWT_SECRET in .env.prod}
      POSTGRES_DSN: ${POSTGRES_DSN:?Set POSTGRES_DSN in .env.prod}
      GF_GCFG_PATH: /app
    volumes:
      - ../infra/linapro.config.yaml:/app/config.yaml:ro
      - ../data/linapro-upload:/app/temp/upload
      - ../data/linapro-output:/app/temp/output

  h5:
    image: ${H5_IMAGE:?Set H5_IMAGE in .env.prod}
    container_name: brain-rehab-h5
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "18080:80"
    depends_on:
      - linapro
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  1panel-network:
    external: true
